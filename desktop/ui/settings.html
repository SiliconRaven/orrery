<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title data-i18n="orrery 桌面设置 · Beta 0.10.0-beta.2">orrery 桌面设置 · Beta 0.10.0-beta.2</title>
<link rel="stylesheet" href="settings.css">
<script type="module" src="settings.mjs"></script>
</head>
<body>
<div id="view" role="dialog" aria-labelledby="title" aria-describedby="sub" tabindex="-1">
  <header>
    <div>
      <h1 id="title" data-i18n="桌面设置">桌面设置</h1>
      <p id="sub" data-i18n="在 + 面板里点一个没在运行的应用时，外壳从这里的位置启动它，不带任何参数。只有你在这里点了“使用这个位置”或在系统对话框里选中的程序才会被保存。">在 + 面板里点一个没在运行的应用时，外壳从这里的位置启动它，不带任何参数。只有你在这里点了“使用这个位置”或在系统对话框里选中的程序才会被保存。</p>
    </div>
    <button id="close" type="button" data-i18n-title="关闭（Esc）" title="关闭（Esc）" data-i18n-aria-label="关闭应用位置设置" aria-label="关闭应用位置设置">×</button>
  </header>
  <div class="language-row"><label for="language" data-i18n="界面语言">界面语言</label><select id="language"><option value="zh">中文</option><option value="en">English</option></select><span data-i18n="桌面立即切换；协作页下次打开或刷新时生效，当前内容不会重新加载。">桌面立即切换；协作页下次打开或刷新时生效，当前内容不会重新加载。</span></div>
  <ul id="rows" data-i18n-aria-label="支持的应用" aria-label="支持的应用"></ul>
</div>
</body>
</html>
