<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>orrery · Beta 0.10.0-beta.1</title>
<link rel="stylesheet" href="tabs.css">
<script type="module" src="tabs.mjs"></script>
</head>
<body>
<header id="bar">
  <nav id="tabs" role="tablist" aria-label="标签"></nav>
  <button id="add" type="button" title="添加应用窗口" aria-label="添加应用窗口" aria-expanded="false" aria-haspopup="true">
    <svg viewBox="0 0 16 16" width="16" height="16" focusable="false" aria-hidden="true"><path d="M8 2.5v11M2.5 8h11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
  </button>
  <button id="layout" type="button" title="分屏：单栏、左右两栏、四宫格" aria-label="选择分屏布局">
    <svg viewBox="0 0 16 16" width="18" height="18" focusable="false" aria-hidden="true">
      <rect x="1.5" y="2.5" width="13" height="11" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.2"/>
      <path d="M8 2.5v11M1.5 8h13" stroke="currentColor" stroke-width="1.2"/>
    </svg>
  </button>
  <button id="settings" type="button" title="应用位置：从哪里启动各个应用" aria-label="应用位置设置" aria-expanded="false" aria-haspopup="dialog">
    <svg viewBox="0 0 16 16" width="17" height="17" focusable="false" aria-hidden="true">
      <path d="M6.9 1.5h2.2l.35 1.8 1.2.5 1.5-1 1.55 1.55-1 1.5.5 1.2 1.8.35v2.2l-1.8.35-.5 1.2 1 1.5-1.55 1.55-1.5-1-1.2.5-.35 1.8H6.9l-.35-1.8-1.2-.5-1.5 1-1.55-1.55 1-1.5-.5-1.2-1.8-.35V6.9l1.8-.35.5-1.2-1-1.5L3.85 2.3l1.5 1 1.2-.5z" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"/>
      <circle cx="8" cy="8" r="2.1" fill="none" stroke="currentColor" stroke-width="1.1"/>
    </svg>
  </button>
</header>
<main id="panel" data-layout="single" aria-live="polite">
  <div class="pane c0 r0"></div>
  <div class="pane c1 r0"></div>
  <div class="pane c0 r1"></div>
  <div class="pane c1 r1"></div>
  <div id="vdiv" class="divider" role="separator" aria-orientation="vertical" aria-label="拖动调整两栏的宽度"></div>
  <div id="hdiv" class="divider" role="separator" aria-orientation="horizontal" aria-label="拖动调整上下两行的高度"></div>
</main>
<div id="notice" role="status" hidden><span id="notice-text"></span><button id="notice-close" type="button" aria-label="关闭提示">×</button></div>
</body>
</html>
