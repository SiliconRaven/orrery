name: code-health

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install root development dependencies
        run: npm ci --no-audit --no-fund

      - name: Install desktop dependency metadata
        # Knip needs package metadata, not the Electron binary or native install scripts.
        run: npm ci --prefix desktop --ignore-scripts --no-audit --no-fund

      - name: Check unused files, dependencies, and cycles
        run: npm run check:health

      - name: Run the collaboration benchmark
        run: npm run --silent bench:collaboration
